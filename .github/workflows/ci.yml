name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      # requires-python is >=3.12, so the reusable default matrix's 3.11 leg
      # cannot resolve.
      python-versions: '["3.12", "3.14"]'
      wheel-import: setjoin
      coverage-floor: 75
      run-preen: true
