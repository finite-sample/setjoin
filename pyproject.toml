[project]
name = "setjoin"
version = "0.1.0"
description = "Set-aware record linkage with structure-preserving joins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gaurav Sood" }]
keywords = [
    "record-linkage",
    "data-matching",
    "hierarchical-data",
    "hungarian-algorithm",
    "entity-resolution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.12",
    "rich>=13.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
    "pandas-stubs>=2.0",
    "vulture>=2.11",
    "bandit>=1.7",
    "pydoclint>=0.5",
]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
]
all = ["setjoin[viz,dev,docs]"]

[project.urls]
Homepage = "https://github.com/finite-sample/setjoin"
Documentation = "https://finite-sample.github.io/setjoin"
Repository = "https://github.com/finite-sample/setjoin"
Issues = "https://github.com/finite-sample/setjoin/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["setjoin"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.vulture]
paths = ["setjoin"]
min_confidence = 95

[tool.bandit]
targets = ["setjoin"]
skips = []

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
check-return-types = true
check-yield-types = true
